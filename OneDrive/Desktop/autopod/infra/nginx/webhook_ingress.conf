# AutoPod Cloud -- Webhook-Only Public Ingress Proxy Configuration
#
# Dedicated, hardened reverse proxy for exposing ONLY the GitHub webhook
# endpoint (/webhook) through a temporary public HTTPS tunnel (e.g. Cloudflare
# Tunnel or ngrok) without exposing Flask port 5000 or any administrative,
# debug, or container management API routes.
#
# Security Architecture:
# 1. Deny-by-default: location / returns 404 for all unspecified paths.
# 2. Exact match: location = /webhook permits ONLY the exact path /webhook.
# 3. Method restriction: limit_except POST OPTIONS denies all non-POST/OPTIONS methods with 403.
# 4. Trailing slashes, subpaths, and path traversals (/webhook/, /webhook/.., /api) return 404.
# 5. Fixed upstream target: proxy_pass forwards strictly to /webhook on autopod-backend:5000.
# 6. Preserves raw payload and headers for HMAC-SHA256 signature verification.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Maximum payload size for GitHub webhook events (GitHub payloads rarely exceed 5MB)
    client_max_body_size 10M;

    # Suppress Nginx server version in error headers
    server_tokens off;

    # -------------------------------------------------------------------------
    # Catch-all: Deny all paths by default with 404 Not Found
    # -------------------------------------------------------------------------
    location / {
        default_type application/json;
        return 404 '{"error": "Not Found", "message": "Endpoint not exposed on webhook ingress"}\n';
    }

    # -------------------------------------------------------------------------
    # Exact Match: /webhook ONLY
    # -------------------------------------------------------------------------
    location = /webhook {
        # Strictly restrict HTTP methods to POST and OPTIONS (CORS preflight)
        limit_except POST OPTIONS {
            deny all;
        }

        # Forward strictly to the backend's /webhook endpoint
        proxy_pass http://autopod-backend:5000/webhook;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Ensure raw body is streamed unmodified for HMAC-SHA256 verification
        proxy_pass_request_body on;
        proxy_pass_request_headers on;

        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }
}
