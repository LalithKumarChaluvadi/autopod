# AutoPod Cloud -- Ansible inventory.
#
# Fill in the IPs from `terraform output` after `terraform apply`
# (ARCHITECTURE.md Section 5.1's "Ansible -> EC2 relationship" diagram):
#   terraform -chdir=../terraform output -raw control_plane_public_ip
#   aws autoscaling describe-auto-scaling-groups \
#     --auto-scaling-group-names "$(terraform -chdir=../terraform output -raw autoscaling_group_name)" \
#     --query "AutoScalingGroups[0].Instances[].InstanceId" --output text \
#   | xargs -n1 aws ec2 describe-instances --instance-ids \
#     --query "Reservations[].Instances[].PublicIpAddress" --output text
#
# This file intentionally ships with PLACEHOLDER IPs -- it is not wired to
# any real AWS account from this repository. Replace them before running
# the playbook, and never commit real production IPs/credentials if this
# repo is ever made public (IPs alone are low-sensitivity, but treat this
# file as environment-specific config, not a template to hardcode real
# infrastructure into long-term).

[control_plane]
control-plane ansible_host=98.92.143.215

[app_nodes]
app-node-1 ansible_host=98.80.206.162
app-node-2 ansible_host=3.82.136.227

[all:vars]
ansible_user=ec2-user
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
# Point this at the private key matching the key_pair_name used in
# infra/terraform/terraform.tfvars. Never commit the actual private key.
ansible_ssh_private_key_file=~/.ssh/my-key.pem

